server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      validation-timeout: 5000

  application:
    name: blog-backend

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=200,expireAfterAccess=1800s

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
    cache-enabled: true
    default-statement-timeout: 30
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.blog.entity
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:mySecretKey1234567890123456789012345678901234567890123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

logging:
  level:
    root: WARN
    com.example.blog: ${APP_LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.springframework.web: INFO
    com.baomidou.mybatisplus: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

file:
  upload-dir: ./uploads
  max-size: 10485760

# 管理员注册邀请码
admin:
  invite-code: ADMIN2026

# 登录限流配置
rate-limit:
  max-login-attempts: 5
  lockout-duration-minutes: 15
  attempt-window-minutes: 5
  global-ip-max-attempts: 20
  global-ip-lockout-seconds: 60
