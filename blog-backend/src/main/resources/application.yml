# =====================================================
# 本地开发配置
# =====================================================
# 本项目当前仅用于本地运行，所有配置均为本地默认值，
# 如需改动可直接修改本文件，或用环境变量覆盖（见注释说明）。
# =====================================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: blog-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 可用环境变量 DB_URL / DB_USERNAME / DB_PASSWORD 覆盖
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      validation-timeout: 5000

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=200,expireAfterAccess=1800s

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 本地默认关闭 SQL 打印；排查问题时改为 org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
    cache-enabled: true
    default-statement-timeout: 30
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.blog.entity
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:mySecretKey1234567890123456789012345678901234567890123456789012345678901234567890}
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    root: WARN
    com.example.blog: INFO
    org.springframework.security: WARN
    org.springframework.web: INFO
    com.baomidou.mybatisplus: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

file:
  # 图片上传目录（相对项目根目录）
  upload-dir: ./uploads
  max-size: 10485760

# 管理员注册邀请码
admin:
  invite-code: ADMIN2026

# 登录限流
rate-limit:
  max-login-attempts: 5
  lockout-duration-minutes: 15
  attempt-window-minutes: 5
  global-ip-max-attempts: 20
  global-ip-lockout-seconds: 60
