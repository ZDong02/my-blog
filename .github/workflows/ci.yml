name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Backend Build and Test
  backend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B clean compile
      working-directory: blog-backend

    - name: Run tests
      run: mvn -B test
      working-directory: blog-backend

    - name: Package
      run: mvn -B package -DskipTests
      working-directory: blog-backend

  # Frontend Build and Test
  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: social-factory-blog/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: social-factory-blog

    - name: Build
      run: npm run build
      working-directory: social-factory-blog

  # Docker Build (only on main branch)
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./blog-backend
        file: ./blog-backend/Dockerfile
        push: false
        tags: blog-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./social-factory-blog
        file: ./social-factory-blog/Dockerfile.nginx
        push: false
        tags: blog-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
