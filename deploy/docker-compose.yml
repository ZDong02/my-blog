services:
  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/var/www/blog/dist:ro
      - ./uploads:/var/www/blog/uploads
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - blog-network

  backend:
    image: eclipse-temurin:17-jre
    container_name: blog-backend
    ports:
      - "8080:8080"
    working_dir: /app
    command: ["java", "-Xmx768m", "-Xms256m", "-jar", "blog-backend.jar", "--spring.profiles.active=prod"]
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MINIO_ENABLED=true
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-B1ogM1n10@2026}
      - MINIO_BUCKET=blog
      - DB_URL=jdbc:mysql://mysql:3306/blog_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_USERNAME:-blog_user}
      - DB_PASSWORD=${DB_PASSWORD:-B1ogP@ss2026}
      - JWT_SECRET=${JWT_SECRET:-ZBlogSecretKey2026ForProductionUseOnly123456789012345678901234567890}
    volumes:
      - ./backend.jar:/app/blog-backend.jar:ro
      - ./uploads:/var/www/blog/uploads
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/posts?page=1&size=1 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - blog-network
    mem_limit: 768m
    cpus: 1

  mysql:
    image: mysql:8.3
    container_name: blog-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-B1ogR00t@2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog_db}
      MYSQL_USER: ${DB_USERNAME:-blog_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-B1ogP@ss2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init-full.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - blog-network

  minio:
    image: minio/minio:latest
    container_name: blog-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-B1ogM1n10@2026}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge

volumes:
  mysql_data:
  minio_data:
